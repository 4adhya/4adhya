<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg1" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d5a3d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1a4a2d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="12" fill="url(#bg1)"/>
  <rect width="800" height="280" rx="12" fill="url(#glow1)"/>
  <rect width="800" height="280" rx="12" fill="url(#glow2)"/>

  <!-- Subtle noise texture circles -->
  <circle cx="650" cy="60" r="120" fill="#2d5a3d" opacity="0.12" filter="url(#blur1)"/>
  <circle cx="150" cy="220" r="100" fill="#1a4a2d" opacity="0.15" filter="url(#blur1)"/>

  <!-- Name -->
  <text x="400" y="118" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="58" font-weight="700" fill="#f0f0f0" text-anchor="middle" letter-spacing="-1">
    aadhyasharma
  </text>

  <!-- Tagline -->
  <text x="400" y="150" font-family="'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" font-weight="400" fill="#6b8f76" text-anchor="middle" letter-spacing="5">
    CODE · CREATE · LEARN
  </text>

  <!-- Pill tags -->
  <!-- pill 1 -->
  <rect x="271" y="176" width="80" height="26" rx="13" fill="none" stroke="#2d5a3d" stroke-width="1"/>
  <text x="311" y="193" font-family="'SF Pro Text', -apple-system, sans-serif"
        font-size="11.5" fill="#7aad8a" text-anchor="middle">open source</text>

  <!-- pill 2 -->
  <rect x="361" y="176" width="78" height="26" rx="13" fill="none" stroke="#2d5a3d" stroke-width="1"/>
  <text x="400" y="193" font-family="'SF Pro Text', -apple-system, sans-serif"
        font-size="11.5" fill="#7aad8a" text-anchor="middle">developer</text>

  <!-- pill 3 -->
  <rect x="449" y="176" width="80" height="26" rx="13" fill="none" stroke="#2d5a3d" stroke-width="1"/>
  <text x="489" y="193" font-family="'SF Pro Text', -apple-system, sans-serif"
        font-size="11.5" fill="#7aad8a" text-anchor="middle">minimalism</text>
</svg>
