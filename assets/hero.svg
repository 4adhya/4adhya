      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d5a3d" stop-opacity="0.5"/>
