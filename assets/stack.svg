  <!-- Row 2 pills -->
  <!-- TypeScript -->
  <rect x="191" y="90" width="94" height="26" rx="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="238" y="107" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
