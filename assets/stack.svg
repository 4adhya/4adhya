  <!-- Figma -->
  <rect x="427" y="90" width="62" height="26" rx="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="458" y="107" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
