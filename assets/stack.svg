<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="stackBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111111"/>
