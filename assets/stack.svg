<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="stackBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <rect width="800" height="160" rx="12" fill="url(#stackBg)"/>
  <circle cx="400" cy="80" r="150" fill="#1a2a1a" opacity="0.2" filter="url(#glow)"/>

  <!-- STACK label -->
  <text x="400" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="10" font-weight="500" fill="#3d3d3d" text-anchor="middle" letter-spacing="4">STACK</text>

  <!-- Row 1 pills -->
  <!-- Python -->
  <rect x="84" y="50" width="72" height="26" rx="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="120" y="67" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#9a9a9a" text-anchor="middle">Python</text>

  <!-- JavaScript -->
  <rect x="166" y="50" width="100" height="26" rx="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="216" y="67" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#9a9a9a" text-anchor="middle">JavaScript</text>

  <!-- React -->
  <rect x="276" y="50" width="68" height="26" rx="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="310" y="67" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
