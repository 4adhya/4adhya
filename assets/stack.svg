  <!-- Node.js -->
  <rect x="354" y="50" width="72" height="26" rx="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="390" y="67" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#9a9a9a" text-anchor="middle">Node.js</text>

  <!-- Git -->
  <rect x="436" y="50" width="52" height="26" rx="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="462" y="67" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="12" fill="#9a9a9a" text-anchor="middle">Git</text>

  <!-- SQL -->
  <rect x="498" y="50" width="52" height="26" rx="13" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
