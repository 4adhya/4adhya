<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left panel gradient - dark red/maroon -->
    <radialGradient id="leftBg" cx="30%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#3a1515"/>
      <stop offset="60%" stop-color="#1e0e0e"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="25%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#5a1f1f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>

    <!-- Right top panel gradient - dark blue/navy -->
    <radialGradient id="rightTopBg" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- Right bottom panel gradient - dark gold -->
    <radialGradient id="rightBotBg" cx="80%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#1a160a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <filter id="softblur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- LEFT PANEL -->
  <rect x="0" y="0" width="520" height="200" rx="12" fill="url(#leftBg)"/>
  <rect x="0" y="0" width="520" height="200" rx="12" fill="url(#leftGlow)"/>
  <circle cx="100" cy="160" r="80" fill="#6b1a1a" opacity="0.2" filter="url(#softblur)"/>
  <circle cx="420" cy="50" r="60" fill="#3a1010" opacity="0.3" filter="url(#softblur)"/>

  <!-- ABOUT label -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="10" font-weight="500" fill="#6b4040" letter-spacing="3">ABOUT</text>

  <!-- Main tagline -->
  <text x="32" y="96" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="700" fill="#f0eded">Building things</text>
  <text x="32" y="136" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="700" fill="#f0eded">that matter.</text>

  <!-- Sub tagline -->
  <text x="32" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="13" fill="#7a5555" font-style="normal">&gt; open to collaborations_</text>

  <!-- RIGHT TOP PANEL -->
  <rect x="528" y="0" width="272" height="96" rx="12" fill="url(#rightTopBg)"/>
  <circle cx="750" cy="20" r="50" fill="#1a2a4a" opacity="0.4" filter="url(#softblur)"/>

  <!-- Target icon -->
  <circle cx="686" cy="48" r="20" fill="none" stroke="#e05a5a" stroke-width="2" opacity="0.8"/>
  <circle cx="686" cy="48" r="12" fill="none" stroke="#e05a5a" stroke-width="1.5" opacity="0.6"/>
  <circle cx="686" cy="48" r="4" fill="#e05a5a" opacity="0.9"/>
  <line x1="686" y1="24" x2="686" y2="72" stroke="#e05a5a" stroke-width="1" opacity="0.4"/>
  <line x1="662" y1="48" x2="710" y2="48" stroke="#e05a5a" stroke-width="1" opacity="0.4"/>

  <text x="724" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="8.5" font-weight="600" fill="#4a6080" letter-spacing="2">ALWAYS</text>
  <text x="724" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="8.5" font-weight="600" fill="#4a6080" letter-spacing="2">LEARNING</text>

  <!-- RIGHT BOTTOM PANEL -->
  <rect x="528" y="104" width="272" height="96" rx="12" fill="url(#rightBotBg)"/>
  <circle cx="750" cy="180" r="50" fill="#2a1f05" opacity="0.5" filter="url(#softblur)"/>

  <!-- Star icon -->
  <polygon points="686,28 690,42 704,42 693,51 697,65 686,56 675,65 679,51 668,42 682,42"
           transform="translate(0,76)" fill="#e8b84b" opacity="0.9"/>

  <text x="724" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="8.5" font-weight="600" fill="#6b5a20" letter-spacing="2">CRAFT</text>
  <text x="724" y="158" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="8.5" font-weight="600" fill="#6b5a20" letter-spacing="2">MATTERS</text>
</svg>
