<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>

    <!-- Fill area gradient under the line -->
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c6ef5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c6ef5" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow filter on the line -->
    <filter id="lineGlow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot glow -->
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to keep fill inside chart area -->
    <clipPath id="chartClip">
      <rect x="46" y="16" width="740" height="152"/>
    </clipPath>

    <style>
      /* ── Line draw animation ── */
      .graph-line {
        stroke-dasharray: 2200;
        stroke-dashoffset: 2200;
        animation: drawLine 2.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }

      /* ── Fill fade-in ── */
      .graph-fill {
        opacity: 0;
        animation: fadeIn 1.2s ease 1.8s forwards;
      }
      @keyframes fadeIn {
        to { opacity: 1; }
      }

      /* ── Dots pop in one by one ── */
      .dot {
        opacity: 0;
        transform-origin: center;
        animation: popDot 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes popDot {
        from { opacity: 0; transform: scale(0); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* ── Label fade ── */
      .label {
        opacity: 0;
        animation: fadeIn 0.6s ease forwards;
      }

      /* ── Pulse on peak dot ── */
      @keyframes pulse {
        0%, 100% { r: 4; opacity: 1; }
        50%       { r: 6.5; opacity: 0.6; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)"/>

  <!-- Grid lines (horizontal) -->
  <line x1="46" y1="32"  x2="786" y2="32"  stroke="#1e2530" stroke-width="0.8"/>
  <line x1="46" y1="56"  x2="786" y2="56"  stroke="#1e2530" stroke-width="0.8"/>
  <line x1="46" y1="80"  x2="786" y2="80"  stroke="#1e2530" stroke-width="0.8"/>
  <line x1="46" y1="104" x2="786" y2="104" stroke="#1e2530" stroke-width="0.8"/>
  <line x1="46" y1="128" x2="786" y2="128" stroke="#1e2530" stroke-width="0.8"/>
  <line x1="46" y1="152" x2="786" y2="152" stroke="#1e2530" stroke-width="0.8"/>

  <!-- Y-axis labels -->
  <text x="38" y="36"  font-family="monospace" font-size="9" fill="#3d4d6a" text-anchor="end" class="label" style="animation-delay:2.4s">14</text>
  <text x="38" y="60"  font-family="monospace" font-size="9" fill="#3d4d6a" text-anchor="end" class="label" style="animation-delay:2.4s">10</text>
  <text x="38" y="84"  font-family="monospace" font-size="9" fill="#3d4d6a" text-anchor="end" class="label" style="animation-delay:2.4s">6</text>
  <text x="38" y="108" font-family="monospace" font-size="9" fill="#3d4d6a" text-anchor="end" class="label" style="animation-delay:2.4s">4</text>
  <text x="38" y="132" font-family="monospace" font-size="9" fill="#3d4d6a" text-anchor="end" class="label" style="animation-delay:2.4s">2</text>
  <text x="38" y="156" font-family="monospace" font-size="9" fill="#3d4d6a" text-anchor="end" class="label" style="animation-delay:2.4s">0</text>

  <!--
    Data mapping (30 days, x from 46 to 786, y from 152 (0) to 32 (14)):
    y = 152 - (val/14)*120

    Days & values (approx from screenshot):
    0:1  1:0  2:0  3:0  4:0  5:2  6:3  7:13 8:1  9:0
    10:1 11:0 12:0 13:0 14:0 15:0 16:5 17:2 18:3 19:0
    20:1 21:1 22:0 23:4 24:0 25:0 26:1 27:0 28:0 29:0
  -->

  <!-- x step = 740/29 ≈ 25.5 -->

  <!-- Filled area (clipped) — drawn first, animated after line -->
  <g clip-path="url(#chartClip)">
    <polygon class="graph-fill"
      fill="url(#fillGrad)"
      points="
        46,143.6
        71.5,152  97,152  122.5,152  148,152
        173.6,135.7
        199,118
        224.5,40.3
        250,143.6
        275.5,152
        301,143.6
        326.5,152  352,152  377.5,152  403,152  428.5,152
        454,109.4
        479.5,135.7
        505,118
        530.5,152
        556,143.6
        581.5,143.6
        607,152
        632.5,117.7
        658,152  683.5,152
        709,143.6
        734.5,152  760,152  785.5,152
        785.5,152  46,152
      "
    />
  </g>

  <!-- Main line -->
  <polyline class="graph-line"
    fill="none"
    stroke="#8b7ff5"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#lineGlow)"
    points="
      46,143.6
      71.5,152  97,152  122.5,152  148,152
      173.6,135.7
      199,118
      224.5,40.3
      250,143.6
      275.5,152
      301,143.6
      326.5,152  352,152  377.5,152  403,152  428.5,152
      454,109.4
      479.5,135.7
      505,118
      530.5,152
      556,143.6
      581.5,143.6
      607,152
      632.5,117.7
      658,152  683.5,152
      709,143.6
      734.5,152  760,152  785.5,152
    "
  />

  <!-- Dots — staggered pop-in after line finishes -->
  <g filter="url(#dotGlow)">
    <!-- Each dot: class="dot" style="animation-delay:Xs" -->
    <circle class="dot" cx="46"   cy="143.6" r="3.5" fill="#9d8ff7" style="animation-delay:2.85s"/>
    <circle class="dot" cx="71.5" cy="152"   r="3"   fill="#6a5fd0" style="animation-delay:2.90s"/>
    <circle class="dot" cx="97"   cy="152"   r="3"   fill="#6a5fd0" style="animation-delay:2.95s"/>
    <circle class="dot" cx="122.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:3.00s"/>
    <circle class="dot" cx="148"  cy="152"   r="3"   fill="#6a5fd0" style="animation-delay:3.05s"/>
    <circle class="dot" cx="173.6" cy="135.7" r="3.5" fill="#9d8ff7" style="animation-delay:3.10s"/>
    <circle class="dot" cx="199"  cy="118"   r="3.5" fill="#9d8ff7" style="animation-delay:3.15s"/>
    <!-- PEAK dot — glowing + pulsing -->
    <circle cx="224.5" cy="40.3" r="5" fill="#c4baff" opacity="0" style="animation: popDot 0.4s cubic-bezier(0.34,1.56,0.64,1) 3.2s forwards, pulse 2s ease-in-out 3.7s infinite;" filter="url(#dotGlow)"/>
    <circle class="dot" cx="250"  cy="143.6" r="3.5" fill="#9d8ff7" style="animation-delay:3.25s"/>
    <circle class="dot" cx="275.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:3.30s"/>
    <circle class="dot" cx="301"  cy="143.6" r="3.5" fill="#9d8ff7" style="animation-delay:3.35s"/>
    <circle class="dot" cx="326.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:3.40s"/>
    <circle class="dot" cx="352"  cy="152"   r="3"   fill="#6a5fd0" style="animation-delay:3.45s"/>
    <circle class="dot" cx="377.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:3.50s"/>
    <circle class="dot" cx="403"  cy="152"   r="3"   fill="#6a5fd0" style="animation-delay:3.55s"/>
    <circle class="dot" cx="428.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:3.60s"/>
    <circle class="dot" cx="454"  cy="109.4" r="3.5" fill="#9d8ff7" style="animation-delay:3.65s"/>
    <circle class="dot" cx="479.5" cy="135.7" r="3.5" fill="#9d8ff7" style="animation-delay:3.70s"/>
    <circle class="dot" cx="505"  cy="118"   r="3.5" fill="#9d8ff7" style="animation-delay:3.75s"/>
    <circle class="dot" cx="530.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:3.80s"/>
    <circle class="dot" cx="556"  cy="143.6" r="3.5" fill="#9d8ff7" style="animation-delay:3.85s"/>
    <circle class="dot" cx="581.5" cy="143.6" r="3.5" fill="#9d8ff7" style="animation-delay:3.90s"/>
    <circle class="dot" cx="607"  cy="152"   r="3"   fill="#6a5fd0" style="animation-delay:3.95s"/>
    <circle class="dot" cx="632.5" cy="117.7" r="3.5" fill="#9d8ff7" style="animation-delay:4.00s"/>
    <circle class="dot" cx="658"  cy="152"   r="3"   fill="#6a5fd0" style="animation-delay:4.05s"/>
    <circle class="dot" cx="683.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:4.10s"/>
    <circle class="dot" cx="709"  cy="143.6" r="3.5" fill="#9d8ff7" style="animation-delay:4.15s"/>
    <circle class="dot" cx="734.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:4.20s"/>
    <circle class="dot" cx="760"  cy="152"   r="3"   fill="#6a5fd0" style="animation-delay:4.25s"/>
    <circle class="dot" cx="785.5" cy="152"  r="3"   fill="#6a5fd0" style="animation-delay:4.30s"/>
  </g>

  <!-- X-axis day labels -->
  <text x="46"    y="172" font-family="monospace" font-size="8.5" fill="#3d4d6a" text-anchor="middle" class="label" style="animation-delay:2.5s">Apr</text>
  <text x="173.6" y="172" font-family="monospace" font-size="8.5" fill="#3d4d6a" text-anchor="middle" class="label" style="animation-delay:2.5s">Apr</text>
  <text x="301"   y="172" font-family="monospace" font-size="8.5" fill="#3d4d6a" text-anchor="middle" class="label" style="animation-delay:2.5s">May</text>
  <text x="454"   y="172" font-family="monospace" font-size="8.5" fill="#3d4d6a" text-anchor="middle" class="label" style="animation-delay:2.5s">May</text>
  <text x="581.5" y="172" font-family="monospace" font-size="8.5" fill="#3d4d6a" text-anchor="middle" class="label" style="animation-delay:2.5s">May</text>
  <text x="709"   y="172" font-family="monospace" font-size="8.5" fill="#3d4d6a" text-anchor="middle" class="label" style="animation-delay:2.5s">May</text>

  <!-- Title -->
  <text x="400" y="14" font-family="monospace" font-size="10" fill="#5a4fbf" text-anchor="middle"
        class="label" style="animation-delay:0s">Aadhya Sharma · Contribution Graph</text>

  <!-- Peak annotation -->
  <g opacity="0" style="animation: fadeIn 0.5s ease 3.3s forwards;">
    <line x1="224.5" y1="48" x2="224.5" y2="152" stroke="#5a4fbf" stroke-width="0.8" stroke-dasharray="3 3"/>
    <rect x="195" y="18" width="60" height="16" rx="4" fill="#1e1a3a"/>
    <text x="225" y="30" font-family="monospace" font-size="9" fill="#c4baff" text-anchor="middle">peak: 13</text>
  </g>
</svg>
